<!--
  Favicon. Misma marca que public/images/logo.svg, recalculada para tamano
  pequeno sobre cuadrado redondeado indigo: el arco crece a radio 16.4 con trazo
  5.2 y la estrella a radio 10.6, porque a 16 px el trazado del logo grande se
  cierra y se convierte en una mancha. El zocalo de terracota desaparece por el
  mismo motivo: a 16 px seria una linea de menos de medio pixel.
-->
