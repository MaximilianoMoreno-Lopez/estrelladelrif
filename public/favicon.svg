<!--
  Favicon. Misma marca que public/images/logo.svg (el yaz tifinagh U+2D63
  sosteniendo la estrella de ocho puntas), recalculada para tamano pequeno sobre
  cuadrado redondeado indigo.

  El trazo pasa de 4.4 a 6.4 y la estrella de radio 7.6 a 9. No es un ajuste
  fino: a 16 px, con el trazo del logo grande, el tallo del yaz mide 1,3 pixeles
  y desaparece, y el octagrama se redondea hasta parecer un punto. Se probaron
  tres pesos a 16, 32 y 48 px y este es el unico que mantiene la figura entera
  sin que a 48 px los brazos se fundan con la estrella.

  Centrado: la tinta va de y=7.9 a y=56.1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="13" fill="#14263f"/>
  <path d="M32 16.9 L32 52.9"
        fill="none" stroke="#f8f5ef" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M20.5 16.9 A11.5 11.5 0 0 0 43.5 16.9"
        fill="none" stroke="#f8f5ef" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M20.5 52.9 A11.5 11.5 0 0 1 43.5 52.9"
        fill="none" stroke="#f8f5ef" stroke-width="6.4" stroke-linecap="round"/>
  <polygon fill="#e0a428" points="32.00,7.90 34.64,10.54 38.36,10.54 38.36,14.26 41.00,16.90 38.36,19.54 38.36,23.26 34.64,23.26 32.00,25.90 29.36,23.26 25.64,23.26 25.64,19.54 23.00,16.90 25.64,14.26 25.64,10.54 29.36,10.54"/>
</svg>
