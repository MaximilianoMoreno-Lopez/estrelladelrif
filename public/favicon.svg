<!--
  Favicon: la marca entera, recalculada para tamano pequeno.

  No vale reducir el logo grande. Se probaron cuatro versiones a 16, 24 y 32 px:
  la marca tal cual se empasta a 16 y queda en una mancha de color; el yaz solo
  se lee perfecto pero pierde la estrella; la estrella sin el yaz se lee
  perfecto pero pierde el simbolo, que es lo que identifica a la asociacion.
  Esta es la cuarta: la marca completa con la estrella ampliada de radio 24 a 28
  para que ocupe el cuadro entero, el trazo de la estrella de 2.26 a 4.2, el del
  yaz de 2.7 a 5 y el yaz un 12% mas grande, con los huecos ensanchados en la
  misma proporcion para que las piezas no se fundan.

  A 16 px se lee como una estrella de colores con algo rojo dentro, y a partir
  de 24 se distingue el yaz entero. En pantallas de alta densidad, que son la
  mayoria, el navegador toma el icono de 32 y la marca se ve completa.

  Sin fondo: la pestana clara del navegador ya es casi del color de la cal, asi
  que el cuadrado no aportaba nada, y sobre pestana oscura la marca se sostiene
  sola. El unico color que sufre sobre oscuro es el azul de la punta superior,
  que se aclara con una consulta de medios dentro del propio SVG. Los iconos de
  192 y 512 y el apple-touch-icon si llevan fondo, porque van a la pantalla de
  inicio y a los datos estructurados, donde se espera una figura solida y iOS
  pinta de negro lo transparente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .azul { stroke: #0076ED; }
    @media (prefers-color-scheme: dark) { .azul { stroke: #3D9BFF; } }
  </style>
  <mask id="m">
  <rect width="64" height="64" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="8.4" stroke-linecap="round">
  <path d="M21.28 18.59 A12.77 12.77 0 0 0 42.72 18.59"/>
  <path d="M32.00 24.43 L32.00 39.57"/>
  <path d="M21.28 45.41 A12.77 12.77 0 0 1 42.72 45.41"/>
  </g>
  </mask>
  <g fill="none" stroke-width="4.2" stroke-linecap="butt" mask="url(#m)">
  <path d="M38.88 15.92 L32.00 4.00 L25.12 15.92" class="azul"/>
  <path d="M21.52 18.00 L7.75 18.00 L14.63 29.92" stroke="#58AF10"/>
  <path d="M14.63 34.08 L7.75 46.00 L21.52 46.00" stroke="#FEC802"/>
  <path d="M25.12 48.08 L32.00 60.00 L38.88 48.08" stroke="#FEC802"/>
  <path d="M42.48 46.00 L56.25 46.00 L49.37 34.08" stroke="#FEC802"/>
  <path d="M49.37 29.92 L56.25 18.00 L42.48 18.00" stroke="#58AF10"/>
  </g>
  <g fill="none" stroke="#DC0E1B" stroke-width="5.0" stroke-linecap="round">
  <path d="M21.28 18.59 A12.77 12.77 0 0 0 42.72 18.59"/>
  <path d="M32.00 24.43 L32.00 39.57"/>
  <path d="M21.28 45.41 A12.77 12.77 0 0 1 42.72 45.41"/>
  </g>
</svg>
