<!--
  Favicon. La marca completa no sirve a tamano pequeno: a 16 px la estrella de
  seis puntas se cierra sobre el yaz y el conjunto queda en una mancha de color.
  Se probaron las dos versiones a 16, 32 y 48 px y aqui va solo el yaz, que es
  el elemento que identifica a la asociacion y el unico que sobrevive entero.

  Fondo de cal y yaz en rojo, los mismos colores que en el logo grande. Se
  descarto el cuadrado indigo con el yaz en cal, que contrasta algo mejor a
  16 px, porque el indigo ya no aparece en la marca nueva.

  El trazo pasa de 2.7 a 6.4 respecto al logo grande: con el trazo original el
  tallo mide 1,3 pixeles a 16 px y desaparece.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="13" fill="#f8f5ef"/>
  <g fill="none" stroke="#DC0E1B" stroke-width="6.4" stroke-linecap="round">
    <path d="M20.5 16.9 A11.5 11.5 0 0 0 43.5 16.9"/>
    <path d="M32 16.9 L32 47.1"/>
    <path d="M20.5 47.1 A11.5 11.5 0 0 1 43.5 47.1"/>
  </g>
</svg>
