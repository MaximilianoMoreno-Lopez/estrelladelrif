<!--
  Marca de Estrella del Rif: el yaz sosteniendo una estrella de ocho puntas.

  El yaz es la letra tifinagh U+2D63 (TIFINAGH LETTER YAZ), el simbolo de la
  identidad amazigh y del Rif, el mismo que ocupa el centro de la bandera
  amazigh. Se dibuja tal cual es la letra: un tallo vertical, un arco que abre
  hacia arriba en el borde superior y otro que abre hacia abajo en el inferior.
  No se estiliza ni se recorta: es un simbolo cultural, no un adorno.

  La estrella de ocho puntas se apoya en el borde superior, entre los dos brazos
  levantados del yaz. Ahi la lectura es literal, "la estrella del Rif": el
  simbolo sostiene la estrella en vez de llevarla al lado. Es tambien lo unico
  que se superpone al glifo, y solo la punta del tallo, que queda dentro del
  abrazo de los brazos.

  Geometria, porque sin ella la marca no se puede reeditar:

  - Arcos: circunferencias de radio 12 centradas en (32, 13.4) y (32, 55.4). El
    superior es la mitad inferior de su circunferencia y el inferior la mitad
    superior, asi que cada uno abre en direccion contraria.
  - Tallo: de (32, 13.4) a (32, 55.4).
  - Estrella: octagrama exacto de dos cuadrados girados 45 grados, centro
    (32, 13.4), radio exterior 7.6 y radio interior 7.6 x 0.76537, que es donde
    se cruzan las aristas de los dos cuadrados.
  - Todo el conjunto queda centrado en el lienzo: la tinta va de y=5.8 a y=57.6.

  Version anterior: un arco de herradura con la estrella dentro. Se retiro a
  peticion de la asociacion para poner en su lugar el simbolo rifeno.

  Colores literales y no variables CSS: este fichero se carga con <img> y a
  traves de <img> una hoja de estilos externa no lo alcanza.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Estrella del Rif">
  <path d="M32 13.4 L32 55.4"
        fill="none" stroke="#f8f5ef" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M20 13.4 A12 12 0 0 0 44 13.4"
        fill="none" stroke="#f8f5ef" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M20 55.4 A12 12 0 0 1 44 55.4"
        fill="none" stroke="#f8f5ef" stroke-width="4.4" stroke-linecap="round"/>
  <polygon fill="#e0a428" points="32.00,5.80 34.23,8.03 37.37,8.03 37.37,11.17 39.60,13.40 37.37,15.63 37.37,18.77 34.23,18.77 32.00,21.00 29.77,18.77 26.63,18.77 26.63,15.63 24.40,13.40 26.63,11.17 26.63,8.03 29.77,8.03"/>
</svg>
