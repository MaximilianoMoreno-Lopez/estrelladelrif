<!--
  Marca de Estrella del Rif: el yaz amazigh dentro de una estrella de seis puntas.

  El yaz es la letra tifinagh U+2D63, el simbolo de la identidad amazigh y del
  Rif, el mismo que ocupa el centro de la bandera amazigh. Va en rojo, como en
  la bandera, y las puntas de la estrella llevan los otros tres colores: azul
  arriba, verde en los brazos altos, amarillo en los bajos y en la punta
  inferior. El significado lo llevan el simbolo y el color, no la decoracion.

  Geometria, para que la marca se pueda reeditar:

  - Estrella: hexagrama regular centrado en (32, 32), radio a las puntas
    23.99 y radio a los vertices interiores 13.85 (= radio / raiz de 3).
    Cada punta se dibuja como una V independiente, del vertice interior a la
    punta y de vuelta al siguiente vertice, retranqueada 1.68 en cada
    extremo: por eso el hexagono interior queda abierto y la estrella se lee
    como seis brazos y no como un contorno cerrado.
  - Yaz: arcos de radio 11.4 con una cuerda de 19.14
    y una flecha de 5.21, con las bocas en y=20.03 y
    y=43.97; el tallo une los fondos de las dos copas.
  - Trazos: 2.26 en la estrella y 2.7 en el yaz. El yaz es
    algo mas grueso a proposito, para que gane el centro.

  Colores literales y no variables CSS: este fichero se carga con <img> y a
  traves de <img> una hoja de estilos externa no lo alcanza.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Estrella del Rif">
  <mask id="paso-del-yaz">
    <rect width="64" height="64" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="4.54" stroke-linecap="round">
  <path d="M22.43 20.03 A11.4 11.4 0 0 0 41.57 20.03"/>
  <path d="M32 25.24 L32 38.76"/>
  <path d="M22.43 43.97 A11.4 11.4 0 0 1 41.57 43.97"/>
    </g>
  </mask>
  <g fill="none" stroke-width="2.26" stroke-linecap="butt" stroke-linejoin="miter" mask="url(#paso-del-yaz)">
  <path d="M38.08 18.55 L32 8.01 L25.92 18.55" stroke="#3D9BFF"/>
  <path d="M23.39 20.01 L11.23 20.01 L17.31 30.54" stroke="#58AF10"/>
  <path d="M17.31 33.46 L11.23 43.99 L23.39 43.99" stroke="#FEC802"/>
  <path d="M25.92 45.45 L32 55.99 L38.08 45.45" stroke="#FEC802"/>
  <path d="M40.61 43.99 L52.77 43.99 L46.69 33.46" stroke="#FEC802"/>
  <path d="M46.69 30.54 L52.77 20.01 L40.61 20.01" stroke="#58AF10"/>
  </g>
  <g fill="none" stroke-linecap="round">
  <path d="M22.43 20.03 A11.4 11.4 0 0 0 41.57 20.03"
        stroke="#DC0E1B" stroke-width="2.7"/>
  <path d="M32 25.24 L32 38.76"
        stroke="#DC0E1B" stroke-width="2.7"/>
  <path d="M22.43 43.97 A11.4 11.4 0 0 1 41.57 43.97"
        stroke="#DC0E1B" stroke-width="2.7"/>
  </g>
</svg>
