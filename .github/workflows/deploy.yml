name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # `astro build` no comprueba tipos, asi que un error de TypeScript pasaba
      # el despliegue sin que nadie se enterara. Este paso lo caza antes.
      - name: Check
        run: npx astro check
      # El sitio vive en la raiz de estrelladelrif.eu (dominio fijado en
      # public/CNAME), asi que se construye sin prefijo de ruta. Para volver al
      # subdirectorio de GitHub Pages bastaria con `env: GH_SUBPATH: '1'` aqui y
      # borrar public/CNAME: ninguna pagina depende del modo.
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
